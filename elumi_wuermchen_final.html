<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elumi — Würmchen Animation</title>
<!--
  ╔═══════════════════════════════════════════════════════════════╗
  ║  ELUMI WÜRMCHEN — Entwickler-Handover                        ║
  ║                                                               ║
  ║  Animationstyp : CSS SVG path-Morphing + transform           ║
  ║  Währung       : Häufige Beute (Common)                      ║
  ║                                                               ║
  ║  ANIMATION-VARIABLEN (alle an einer Stelle anpassen):        ║
  ║  --duration-crawl   : Durchlauf links→rechts (8s = langsam)  ║
  ║  --duration-body    : Accordion-Zyklus (0.65s = aktuell)     ║
  ║  --duration-bob     : Auf/Ab-Welle (gleich wie body)         ║
  ║  --duration-blink   : Blinzel-Rhythmus (3.5s)                ║
  ║                                                               ║
  ║  FARBCODES:                                                   ║
  ║  #FF4D80  elumiPink  — Körper Hauptfarbe                     ║
  ║  #FF8FA3  elumiRose  — Segment-Streifen                      ║
  ║  #FFB3BA  elumiBlush — Wange, rechte Antenne                 ║
  ║  #1A1A2E  elumiNavy  — Pupille                               ║
  ║                                                               ║
  ║  FÜR LOTTIE-EXPORT: Diese Datei im Browser öffnen,           ║
  ║  Timings aus den @keyframes ablesen und in Lottie/Rive        ║
  ║  nachbauen. Pfad-Morphing = Shape Layer in After Effects.    ║
  ╚═══════════════════════════════════════════════════════════════╝
-->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0F2D48;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  flex-direction: column;
  gap: 28px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}

/* ─────────────────────────────────────────
   STAGE — swap background to transparent
   when embedding in app (set bg: none)
───────────────────────────────────────── */
.stage {
  width: 520px;
  height: 180px;
  background: #0F2D48;
  border-radius: 24px;
  position: relative;
  overflow: hidden;
}
.ground {
  position: absolute;
  bottom: 44px; left: 0; right: 0;
  height: 1px;
  background: rgba(255,255,255,0.07);
}
.dirt {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 44px;
  background: rgba(255,77,128,0.04);
}

/* ─────────────────────────────────────────
   TIMING VARIABLES
   Adjust here to make faster/slower.
   Recommended fast version for app: 0.35s body, 5s crawl
───────────────────────────────────────── */
:root {
  --duration-crawl  : 8s;    /* left→right loop. Faster = 5s */
  --duration-body   : 0.65s; /* accordion cycle. Faster = 0.35s */
  --duration-bob    : 0.65s; /* vertical bob. Match body. */
  --duration-blink  : 3.5s;  /* eye blink. Keep as-is. */
  --duration-ant    : 0.65s; /* antenna wiggle. Match body. */
}

/* ─────────────────────────────────────────
   CRAWL — horizontal movement left→right
───────────────────────────────────────── */
@keyframes crawl {
  0%   { transform: translateX(-200px); }
  100% { transform: translateX(700px); }
}

/* ─────────────────────────────────────────
   BOB — slight vertical sine wave
   synced with accordion rhythm
───────────────────────────────────────── */
@keyframes bob {
  0%,100% { transform: translateY(0px); }
  25%     { transform: translateY(-10px); }
  75%     { transform: translateY(-3px); }
}

/* ─────────────────────────────────────────
   ACCORDION — body path morphing
   Mimics real worm locomotion:
   0%   stretched flat
   25%  beginning to bunch
   50%  fully bunched (S-curve)
   75%  extending forward again
   100% stretched flat again

   All paths share the same number of
   control points so morphing is smooth.
   Head stays at M0,0. Tail moves ~-140 to -172.
───────────────────────────────────────── */
@keyframes accordion {
  0%,100% {
    d: path("M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0");
  }
  25% {
    d: path("M0,0 C-14,-4 -24,-14 -38,-18 C-52,-22 -66,-16 -76,-8 C-86,0 -96,10 -108,12 C-120,14 -132,8 -140,2 C-148,-4 -152,-6 -154,0");
  }
  50% {
    d: path("M0,0 C-10,-6 -18,-18 -30,-22 C-42,-26 -56,-18 -64,-8 C-72,2 -80,14 -94,16 C-108,18 -118,10 -126,2 C-134,-6 -138,-8 -140,0");
  }
  75% {
    d: path("M0,0 C-16,-2 -32,-10 -52,-12 C-72,-14 -88,-6 -102,-1 C-116,4 -130,6 -148,4 C-162,2 -168,0 -170,0");
  }
}

/* ─────────────────────────────────────────
   SEGMENT DASH SCROLL
   Dasharray moves backward as body contracts,
   gives the illusion of peristalsis
───────────────────────────────────────── */
@keyframes segScroll {
  0%,100% { stroke-dashoffset: 0; }
  50%     { stroke-dashoffset: -26; }
}

/* ─────────────────────────────────────────
   EYE BLINK
───────────────────────────────────────── */
@keyframes blink {
  0%,88%,100% { transform: scaleY(1); }
  94%         { transform: scaleY(0.07); }
}

/* ─────────────────────────────────────────
   ANTENNA WIGGLE — alternating left/right
───────────────────────────────────────── */
@keyframes antL {
  0%,100% { transform: rotate(-10deg); }
  50%     { transform: rotate(16deg); }
}
@keyframes antR {
  0%,100% { transform: rotate(6deg); }
  50%     { transform: rotate(-12deg); }
}

/* ─────────────────────────────────────────
   SHADOW — shrinks when body bunches
───────────────────────────────────────── */
@keyframes shadow {
  0%,100% { transform: scaleX(1) scaleY(1); opacity: 0.2; }
  50%     { transform: scaleX(0.75) scaleY(0.7); opacity: 0.12; }
}

/* ─────────────────────────────────────────
   ELEMENT CLASSES
───────────────────────────────────────── */
.worm-crawl {
  position: absolute;
  bottom: 44px;
  left: 0;
  animation: crawl var(--duration-crawl) linear infinite;
}
.worm-bob {
  animation: bob var(--duration-bob) ease-in-out infinite;
}
.body-main {
  animation: accordion var(--duration-body) ease-in-out infinite;
}
.body-shadow {
  animation: accordion var(--duration-body) ease-in-out infinite;
}
.body-segments {
  animation:
    accordion   var(--duration-body) ease-in-out infinite,
    segScroll   var(--duration-body) ease-in-out infinite;
}
.body-highlight {
  animation: accordion var(--duration-body) ease-in-out infinite;
}
.eye-blink {
  animation: blink var(--duration-blink) ease-in-out infinite;
  transform-origin: 14px -8px;
}
.antenna-l {
  animation: antL var(--duration-ant) ease-in-out infinite;
  transform-origin: 8px -17px;
}
.antenna-r {
  animation: antR var(--duration-ant) ease-in-out infinite;
  transform-origin: 18px -17px;
}
.worm-shadow {
  animation: shadow var(--duration-body) ease-in-out infinite;
  transform-origin: -80px 14px;
}

/* ─────────────────────────────────────────
   DEV INFO PANEL
───────────────────────────────────────── */
.info {
  color: rgba(255,255,255,0.25);
  font-size: 11px;
  letter-spacing: 0.8px;
  text-align: center;
  line-height: 1.9;
}
.chip {
  display: inline-block;
  background: rgba(255,77,128,0.18);
  border: 1px solid rgba(255,77,128,0.3);
  color: #FF8FA3;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin: 2px;
  font-family: "SF Mono", "Fira Code", monospace;
}
.tip {
  margin-top: 6px;
  color: rgba(255,255,255,0.18);
  font-size: 11px;
  font-style: italic;
}
</style>
</head>
<body>

<div class="stage">
  <div class="dirt"></div>
  <div class="ground"></div>

  <div class="worm-crawl">
    <div class="worm-bob">
      <svg width="220" height="64" viewBox="-185 -36 220 64" overflow="visible">

        <!-- ground shadow (shrinks when bunched) -->
        <ellipse class="worm-shadow"
                 cx="-86" cy="18" rx="86" ry="6"
                 fill="rgba(0,0,0,0.3)"/>

        <!-- body drop shadow (follows same path, offset) -->
        <path class="body-shadow"
              d="M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0"
              fill="none"
              stroke="rgba(0,0,0,0.22)"
              stroke-width="20"
              stroke-linecap="round"
              transform="translate(1,4)"/>

        <!-- MAIN BODY — elumiPink #FF4D80 -->
        <path class="body-main"
              d="M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0"
              fill="none"
              stroke="#FF4D80"
              stroke-width="20"
              stroke-linecap="round"/>

        <!-- SEGMENT OVERLAY — elumiRose #FF8FA3, dashed -->
        <path class="body-segments"
              d="M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0"
              fill="none"
              stroke="#FF8FA3"
              stroke-width="12"
              stroke-linecap="round"
              stroke-dasharray="9 18"/>

        <!-- HIGHLIGHT — white sheen on top -->
        <path class="body-highlight"
              d="M0,-4 C-20,-4 -40,-5 -62,-4 C-84,-3 -104,-4 -124,-4"
              fill="none"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="6"
              stroke-linecap="round"/>

        <!-- NECK JOIN (static, blends head into body) -->
        <circle cx="-6" cy="0" r="11" fill="#FF4D80"/>

        <!-- HEAD — elumiPink #FF4D80 -->
        <circle cx="15" cy="-1" r="18" fill="#FF4D80"/>
        <!-- head dome highlight -->
        <ellipse cx="10" cy="-9" rx="10" ry="8" fill="rgba(255,255,255,0.13)"/>

        <!-- EYE (blinks every ~3.5s) -->
        <g class="eye-blink">
          <circle cx="15" cy="-9"  r="10"   fill="white"/>
          <circle cx="17" cy="-10" r="6.5"  fill="#1A1A2E"/>  <!-- elumiNavy pupil -->
          <circle cx="19" cy="-12" r="2.4"  fill="white"/>    <!-- main shine -->
          <circle cx="13" cy="-6"  r="1.3"  fill="rgba(255,255,255,0.4)"/> <!-- micro shine -->
        </g>

        <!-- CHEEK BLUSH — elumiBlush #FFB3BA -->
        <ellipse cx="26" cy="5" rx="6.5" ry="3.5" fill="#FFB3BA" opacity="0.65"/>

        <!-- SMILE -->
        <path d="M8,7 Q15,13 24,8"
              fill="none"
              stroke="#1A1A2E"
              stroke-width="2"
              stroke-linecap="round"/>

        <!-- ANTENNA LEFT — elumiRose #FF8FA3 -->
        <g class="antenna-l">
          <line x1="8"  y1="-18" x2="1"  y2="-33"
                stroke="#FF8FA3" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="0" cy="-35" r="3.2" fill="#FF8FA3"/>
        </g>

        <!-- ANTENNA RIGHT — elumiBlush #FFB3BA -->
        <g class="antenna-r">
          <line x1="20" y1="-18" x2="29" y2="-32"
                stroke="#FFB3BA" stroke-width="2.1" stroke-linecap="round"/>
          <circle cx="30" cy="-34" r="2.8" fill="#FFB3BA"/>
        </g>

      </svg>
    </div>
  </div>
</div>

<!-- DEV INFO -->
<div class="info">
  <div>
    <span class="chip">#FF4D80 elumiPink</span>
    <span class="chip">#FF8FA3 elumiRose</span>
    <span class="chip">#FFB3BA elumiBlush</span>
    <span class="chip">#1A1A2E elumiNavy</span>
  </div>
  <div style="margin-top:10px;">
    Für schnellere Animation in der App: in <code style="color:#FF8FA3;">:root</code> setzen —
    <code style="color:#FF8FA3;">--duration-crawl: 5s</code> &nbsp;·&nbsp;
    <code style="color:#FF8FA3;">--duration-body: 0.35s</code>
  </div>
  <div class="tip">
    Lottie/Rive: body-main + body-segments = Shape Layer mit Path Morph · 4 Keyframes bei 0%, 25%, 50%, 75%
  </div>
</div>

</body>
</html>
