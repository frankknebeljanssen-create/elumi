<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elumi — Würmchen Animation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0F2D48; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 24px; font-family: system-ui, sans-serif; }
.stage { width: 520px; height: 240px; background: #0F2D48; border-radius: 24px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
.ground { position: absolute; bottom: 44px; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.07); }
.dirt { position: absolute; bottom: 0; left: 0; right: 0; height: 44px; background: rgba(255,77,128,0.04); }

@keyframes crawl { 0% { transform: translateX(-200px); } 100% { transform: translateX(700px); } }
@keyframes bob { 0%,100%{transform:translateY(0);} 25%{transform:translateY(-10px);} 75%{transform:translateY(-3px);} }
@keyframes acc {
  0%,100% { d: path("M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0"); }
  25%     { d: path("M0,0 C-14,-4 -24,-14 -38,-18 C-52,-22 -66,-16 -76,-8 C-86,0 -96,10 -108,12 C-120,14 -132,8 -140,2 C-148,-4 -152,-6 -154,0"); }
  50%     { d: path("M0,0 C-10,-6 -18,-18 -30,-22 C-42,-26 -56,-18 -64,-8 C-72,2 -80,14 -94,16 C-108,18 -118,10 -126,2 C-134,-6 -138,-8 -140,0"); }
  75%     { d: path("M0,0 C-16,-2 -32,-10 -52,-12 C-72,-14 -88,-6 -102,-1 C-116,4 -130,6 -148,4 C-162,2 -168,0 -170,0"); }
}
@keyframes segD { 0%,100%{stroke-dashoffset:0;} 50%{stroke-dashoffset:-26;} }
@keyframes blink { 0%,88%,100%{transform:scaleY(1);} 94%{transform:scaleY(0.07);} }
@keyframes antA { 0%,100%{transform:rotate(-10deg);} 50%{transform:rotate(16deg);} }
@keyframes antB { 0%,100%{transform:rotate(6deg);} 50%{transform:rotate(-12deg);} }
@keyframes shad { 0%,100%{transform:scaleX(1) scaleY(1);opacity:0.2;} 50%{transform:scaleX(0.75) scaleY(0.7);opacity:0.12;} }

.wo { position:absolute; bottom:44px; left:0; animation: crawl 8s linear infinite; }
.wb { animation: bob 0.65s ease-in-out infinite; }
.bp { animation: acc 0.65s ease-in-out infinite; }
.sp { animation: acc 0.65s ease-in-out infinite, segD 0.65s ease-in-out infinite; }
.hl { animation: acc 0.65s ease-in-out infinite; }
.eg { animation: blink 3.5s ease-in-out infinite; transform-origin:14px -8px; }
.al { animation: antA 0.65s ease-in-out infinite; transform-origin:8px -17px; }
.ar { animation: antB 0.65s ease-in-out infinite; transform-origin:18px -17px; }
.sh { animation: shad 0.65s ease-in-out infinite; transform-origin:-80px 14px; }

.meta { color: rgba(255,255,255,0.35); font-size: 12px; letter-spacing: 1px; text-align: center; }
.token { background: rgba(255,77,128,0.2); border: 1px solid rgba(255,77,128,0.3); color: #FF8FA3; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; display: inline-block; margin: 0 4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="dirt"></div>
  <div class="ground"></div>
  <div class="wo">
    <div class="wb">
      <svg width="220" height="64" viewBox="-185 -36 220 64" overflow="visible">
        <ellipse class="sh" cx="-86" cy="18" rx="86" ry="6" fill="rgba(0,0,0,0.3)"/>
        <path class="bp" d="M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="20" stroke-linecap="round" transform="translate(1,4)"/>
        <path class="bp" d="M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0" fill="none" stroke="#FF4D80" stroke-width="20" stroke-linecap="round"/>
        <path class="sp" d="M0,0 C-20,0 -40,-1 -62,0 C-84,1 -104,0 -124,0 C-144,0 -162,0 -172,0" fill="none" stroke="#FF8FA3" stroke-width="12" stroke-linecap="round" stroke-dasharray="9 18"/>
        <path class="hl" d="M0,-4 C-20,-4 -40,-5 -62,-4 C-84,-3 -104,-4 -124,-4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="-172" cy="0" r="7" fill="#FF4D80"/>
        <circle cx="-6" cy="0" r="11" fill="#FF4D80"/>
        <circle cx="15" cy="-1" r="18" fill="#FF4D80"/>
        <ellipse cx="10" cy="-9" rx="10" ry="8" fill="rgba(255,255,255,0.13)"/>
        <g class="eg">
          <circle cx="15" cy="-9"  r="10"  fill="white"/>
          <circle cx="17" cy="-10" r="6.5" fill="#1A1A2E"/>
          <circle cx="19" cy="-12" r="2.4" fill="white"/>
          <circle cx="13" cy="-6"  r="1.3" fill="rgba(255,255,255,0.4)"/>
        </g>
        <ellipse cx="26" cy="5" rx="6.5" ry="3.5" fill="#FFB3BA" opacity="0.65"/>
        <path d="M8,7 Q15,13 24,8" fill="none" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
        <g class="al">
          <line x1="8"  y1="-18" x2="1"  y2="-33" stroke="#FF8FA3" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="0" cy="-35" r="3.2" fill="#FF8FA3"/>
        </g>
        <g class="ar">
          <line x1="20" y1="-18" x2="29" y2="-32" stroke="#FFB3BA" stroke-width="2.1" stroke-linecap="round"/>
          <circle cx="30" cy="-34" r="2.8" fill="#FFB3BA"/>
        </g>
      </svg>
    </div>
  </div>
</div>
<div class="meta">
  <span class="token">elumiPink #FF4D80</span>
  <span class="token">elumiRose #FF8FA3</span>
  <span class="token">elumiBlush #FFB3BA</span>
  <span class="token">elumiNavy #1A1A2E</span>
  <br><br>
  Elumi Würmchen · Häufige Beute · Kopf voran · CSS SVG Animation · Für Lottie-Übergabe
</div>
</body>
</html>
