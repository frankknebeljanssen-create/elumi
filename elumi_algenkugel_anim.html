<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elumi — Algenkugel Animation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0F2D48; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 24px; font-family: system-ui, sans-serif; }

.stage {
  width: 480px; height: 280px;
  background: #0F2D48;
  border-radius: 24px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}
.floor {
  position: absolute; bottom: 0; left: 0; right: 0; height: 52px;
  background: rgba(35,160,106,0.06);
  border-top: 1px solid rgba(35,160,106,0.14);
}

/* ── ROLL: arc across floor, bounce on walls ── */
@keyframes roll {
  0%   { transform: translate(28px,  192px) rotate(0deg); }
  18%  { transform: translate(360px, 192px) rotate(240deg); }
  22%  { transform: translate(400px, 130px) rotate(266deg); }
  26%  { transform: translate(400px, 104px) rotate(270deg); }
  30%  { transform: translate(360px, 192px) rotate(310deg); }
  48%  { transform: translate(28px,  192px) rotate(520deg); }
  52%  { transform: translate(-8px,  140px) rotate(546deg); }
  56%  { transform: translate(-8px,  104px) rotate(550deg); }
  60%  { transform: translate(28px,  192px) rotate(580deg); }
  78%  { transform: translate(360px, 192px) rotate(810deg); }
  82%  { transform: translate(400px, 90px)  rotate(836deg); }
  86%  { transform: translate(360px, 192px) rotate(876deg); }
  100% { transform: translate(28px,  192px) rotate(1080deg); }
}

/* ── SQUISH on bounce ── */
@keyframes squish {
  0%,15%,32%,47%,65%,80%,97%,100% { transform: scale(1, 1); }
  18%,48%,78% { transform: scale(1.12, 0.88); }
  20%,50%,80% { transform: scale(0.92, 1.10); }
}

/* ── SHADOW ── */
@keyframes shadowAnim {
  0%,100% { transform: translate(28px, 238px) scale(1,1); opacity: 0.22; }
  18%,48%,78% { transform: translate(355px, 238px) scale(1.2,1); opacity: 0.28; }
  22%,52%,82% { transform: translate(395px, 238px) scale(0.5,1); opacity: 0.1; }
  26%,56%,86% { transform: translate(395px, 238px) scale(0.5,1); opacity: 0.1; }
  30%,60%,90% { transform: translate(355px, 238px) scale(1.1,1); opacity: 0.25; }
}

/* ── ALGA WAVES ── */
@keyframes wave1 {
  0%,100% { d: path("M-22,-30 Q-30,-14 -26,2 Q-32,18 -22,32"); }
  50%     { d: path("M-20,-30 Q-28,-10 -24,6 Q-30,22 -20,34"); }
}
@keyframes wave2 {
  0%,100% { d: path("M-6,-32 Q4,-16 -1,2 Q6,20 -4,34"); }
  50%     { d: path("M-4,-32 Q6,-12 1,6 Q8,24 -2,36"); }
}
@keyframes wave3 {
  0%,100% { d: path("M11,-30 Q20,-14 16,2 Q24,18 14,32"); }
  50%     { d: path("M13,-30 Q22,-10 18,6 Q26,22 16,34"); }
}
@keyframes wave4 {
  0%,100% { d: path("M26,-24 Q32,-10 28,6 Q34,20 26,30"); }
  50%     { d: path("M28,-24 Q34,-6 30,10 Q36,24 28,32"); }
}

/* ── GLOSS PULSE (subtle) ── */
@keyframes gloss {
  0%,100% { opacity: 0.22; }
  50%     { opacity: 0.30; }
}

.ball { position: absolute; top: 0; left: 0; animation: roll 5.5s ease-in-out infinite; }
.squisher { animation: squish 5.5s ease-in-out infinite; transform-origin: 0 0; }
.shadow-el { position: absolute; top: 0; left: 0; animation: shadowAnim 5.5s ease-in-out infinite; transform-origin: 0 0; }
.a1 { animation: wave1 1.1s ease-in-out infinite; }
.a2 { animation: wave2 1.4s ease-in-out infinite 0.15s; }
.a3 { animation: wave3 1.2s ease-in-out infinite 0.3s; }
.a4 { animation: wave4 1.5s ease-in-out infinite 0.45s; }
.gloss { animation: gloss 3s ease-in-out infinite; }

.meta { color: rgba(255,255,255,0.35); font-size: 12px; letter-spacing: 1px; text-align: center; }
.token { background: rgba(35,160,106,0.2); border: 1px solid rgba(35,160,106,0.35); color: #2EC4A9; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; display: inline-block; margin: 0 4px; }
</style>
</head>
<body>

<div class="stage">
  <div class="floor"></div>

  <!-- shadow -->
  <svg class="shadow-el" width="0" height="0" overflow="visible" style="position:absolute;top:0;left:0;">
    <ellipse cx="0" cy="0" rx="30" ry="7" fill="rgba(0,0,0,0.5)"/>
  </svg>

  <!-- ball -->
  <div class="ball">
    <div class="squisher">
      <svg width="80" height="80" viewBox="-40 -40 80 80" overflow="visible">
        <!-- main sphere -->
        <circle cx="0" cy="0" r="36" fill="#23A06A"/>

        <!-- alga strands -->
        <path class="a1" d="M-22,-30 Q-30,-14 -26,2 Q-32,18 -22,32" fill="none" stroke="#2EC4A9" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
        <path class="a2" d="M-6,-32  Q4,-16 -1,2 Q6,20 -4,34"        fill="none" stroke="#3DD4B9" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
        <path class="a3" d="M11,-30  Q20,-14 16,2 Q24,18 14,32"       fill="none" stroke="#2EC4A9" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
        <path class="a4" d="M26,-24  Q32,-10 28,6 Q34,20 26,30"       fill="none" stroke="#3DD4B9" stroke-width="4"   stroke-linecap="round" opacity="0.6"/>

        <!-- bottom fronds -->
        <path d="M-18,28 Q-24,38 -16,44" fill="none" stroke="#2EC4A9" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
        <path d="M-2,30  Q-4,40 4,46"    fill="none" stroke="#3DD4B9" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
        <path d="M14,28  Q20,38 16,44"   fill="none" stroke="#2EC4A9" stroke-width="3"   stroke-linecap="round" opacity="0.5"/>

        <!-- primary gloss -->
        <circle class="gloss" cx="-14" cy="-16" r="16" fill="rgba(255,255,255,1)"/>
        <!-- secondary gloss -->
        <circle cx="-20" cy="-22" r="8" fill="rgba(255,255,255,0.28)"/>
        <!-- micro specular -->
        <circle cx="-8"  cy="-28" r="3" fill="rgba(255,255,255,0.22)"/>

        <!-- rim light (makes it feel 3D) -->
        <circle cx="0" cy="0" r="36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
      </svg>
    </div>
  </div>

</div>

<div class="meta">
  <span class="token">elumiGreen #23A06A</span>
  <span class="token">elumiMint #2EC4A9</span>
  <span class="token">elumiMintLight #3DD4B9</span>
  <br><br>
  Elumi Algenkugel · Legendäre Beute · CSS SVG Animation · Für Lottie-Übergabe
</div>

</body>
</html>
