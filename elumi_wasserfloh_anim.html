<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elumi — Wasserfloh Animation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0A2540; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 24px; font-family: system-ui, sans-serif; }

.stage {
  width: 480px; height: 280px;
  background: #0A2540;
  border-radius: 24px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(46,196,169,0.1);
}

/* water bg shimmer lines */
@keyframes waterShimmer {
  0%,100% { opacity: 0.06; }
  50%     { opacity: 0.12; }
}
.wline { animation: waterShimmer ease-in-out infinite; }

/* background bubble rise */
@keyframes bgBubble {
  0%   { transform: translateY(0) translateX(0); opacity: 0.25; }
  50%  { transform: translateY(-120px) translateX(8px); opacity: 0.2; }
  100% { transform: translateY(-280px) translateX(0); opacity: 0; }
}
.bb { animation: bgBubble linear infinite; border-radius: 50%; background: rgba(46,196,169,0.3); position: absolute; }

/* ── SWIM PATH: figure-8 style with flips ── */
@keyframes swim {
  0%   { transform: translate(24px, 150px) scaleX(1)   rotate(-5deg); }
  12%  { transform: translate(160px, 80px) scaleX(1)   rotate(-12deg); }
  22%  { transform: translate(280px, 48px) scaleX(1)   rotate(0deg); }
  25%  { transform: translate(310px, 52px) scaleX(-1)  rotate(0deg); }
  38%  { transform: translate(400px, 110px) scaleX(-1) rotate(8deg); }
  48%  { transform: translate(440px, 180px) scaleX(-1) rotate(5deg); }
  50%  { transform: translate(442px, 190px) scaleX(1)  rotate(5deg); }
  62%  { transform: translate(300px, 230px) scaleX(1)  rotate(3deg); }
  72%  { transform: translate(160px, 200px) scaleX(1)  rotate(-3deg); }
  75%  { transform: translate(130px, 195px) scaleX(-1) rotate(-3deg); }
  88%  { transform: translate(60px, 130px) scaleX(-1)  rotate(-8deg); }
  97%  { transform: translate(20px, 152px) scaleX(-1)  rotate(-5deg); }
  100% { transform: translate(24px, 150px) scaleX(1)   rotate(-5deg); }
}

/* ── LEGS KICK ── */
@keyframes legKick {
  0%,100% { transform: rotate(-28deg); }
  50%     { transform: rotate(28deg); }
}
@keyframes legKick2 {
  0%,100% { transform: rotate(-22deg); }
  50%     { transform: rotate(22deg); }
}

/* ── ANTENNAE SWEEP ── */
@keyframes antSweep {
  0%,100% { transform: rotate(-10deg); }
  50%     { transform: rotate(18deg); }
}

/* ── BUBBLE TRAIL ── */
@keyframes trailBubble {
  0%   { transform: translate(0,0) scale(1); opacity: 0.55; }
  100% { transform: translate(6px,-40px) scale(1.5); opacity: 0; }
}

.flea { position: absolute; top: 0; left: 0; animation: swim 6s ease-in-out infinite; }

.lk  { animation: legKick  0.28s ease-in-out infinite alternate; transform-origin: 0px 0px; }
.lk2 { animation: legKick2 0.28s ease-in-out infinite alternate 0.07s; transform-origin: 0px 0px; }
.lk3 { animation: legKick  0.28s ease-in-out infinite alternate 0.14s; transform-origin: 0px 0px; }
.ant { animation: antSweep 0.9s ease-in-out infinite alternate; transform-origin: -3px 15px; }
.tb1 { animation: trailBubble 1.6s ease-out infinite; }
.tb2 { animation: trailBubble 2.0s ease-out infinite 0.5s; }
.tb3 { animation: trailBubble 1.8s ease-out infinite 1.0s; }

.meta { color: rgba(255,255,255,0.35); font-size: 12px; letter-spacing: 1px; text-align: center; }
.token { background: rgba(46,196,169,0.2); border: 1px solid rgba(46,196,169,0.35); color: #2EC4A9; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; display: inline-block; margin: 0 4px; }
</style>
</head>
<body>

<div class="stage">

  <!-- water lines -->
  <svg style="position:absolute;top:0;left:0;width:100%;height:100%;" viewBox="0 0 480 280" preserveAspectRatio="xMidYMid slice">
    <path class="wline" style="animation-duration:2.8s;" d="M0,200 Q60,190 120,200 Q180,210 240,200 Q300,190 360,200 Q420,210 480,200" fill="none" stroke="#2EC4A9" stroke-width="1"/>
    <path class="wline" style="animation-duration:3.4s;animation-delay:0.6s;" d="M0,170 Q80,160 160,170 Q240,180 320,170 Q400,160 480,170" fill="none" stroke="#2EC4A9" stroke-width="1"/>
    <path class="wline" style="animation-duration:4.1s;animation-delay:1.2s;" d="M0,230 Q100,220 200,230 Q300,240 400,230 Q440,226 480,230" fill="none" stroke="#2EC4A9" stroke-width="0.8"/>
    <path class="wline" style="animation-duration:3.7s;animation-delay:2s;" d="M0,140 Q70,132 140,140 Q210,148 280,140 Q350,132 480,140" fill="none" stroke="#1E9E87" stroke-width="0.7"/>
  </svg>

  <!-- bg bubbles -->
  <div class="bb" style="width:5px;height:5px;left:48px; bottom:0; animation-duration:3.5s;"></div>
  <div class="bb" style="width:4px;height:4px;left:130px;bottom:0; animation-duration:4.2s;animation-delay:1s;"></div>
  <div class="bb" style="width:6px;height:6px;left:220px;bottom:0; animation-duration:3.9s;animation-delay:0.4s;"></div>
  <div class="bb" style="width:3px;height:3px;left:320px;bottom:0; animation-duration:4.8s;animation-delay:1.6s;"></div>
  <div class="bb" style="width:5px;height:5px;left:410px;bottom:0; animation-duration:3.6s;animation-delay:2.4s;"></div>
  <div class="bb" style="width:3px;height:3px;left:70px; bottom:0; animation-duration:5.1s;animation-delay:0.8s;"></div>
  <div class="bb" style="width:4px;height:4px;left:380px;bottom:0; animation-duration:4.0s;animation-delay:3.1s;"></div>

  <!-- FLEA -->
  <div class="flea">
    <svg width="80" height="90" viewBox="-40 -52 80 90" overflow="visible">
      <!-- body shadow -->
      <ellipse cx="2" cy="34" rx="20" ry="6" fill="rgba(0,0,0,0.25)"/>

      <!-- body -->
      <ellipse cx="0" cy="0" rx="21" ry="30" fill="#2EC4A9"/>
      <!-- body sheen -->
      <ellipse cx="-5" cy="-10" rx="13" ry="18" fill="rgba(255,255,255,0.16)"/>

      <!-- antennae -->
      <g class="ant">
        <line x1="-9" y1="-28" x2="-22" y2="-50" stroke="#2EC4A9" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-23" cy="-52" r="4" fill="#2EC4A9"/>
        <line x1="-6" y1="-28" x2="-15" y2="-50" stroke="#1E9E87" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-16" cy="-52" r="4" fill="#1E9E87"/>
      </g>

      <!-- left legs -->
      <g class="lk"  style="transform-origin:-20px -6px;"><line x1="-20" y1="-6"  x2="-36" y2="2"  stroke="#2EC4A9" stroke-width="3" stroke-linecap="round"/><circle cx="-38" cy="3"  r="2.5" fill="#1E9E87"/></g>
      <g class="lk2" style="transform-origin:-20px 4px;"> <line x1="-20" y1="4"   x2="-36" y2="14" stroke="#2EC4A9" stroke-width="3" stroke-linecap="round"/><circle cx="-38" cy="15" r="2.5" fill="#1E9E87"/></g>
      <g class="lk3" style="transform-origin:-20px 14px;"><line x1="-20" y1="14"  x2="-36" y2="26" stroke="#2EC4A9" stroke-width="2.5" stroke-linecap="round"/><circle cx="-37" cy="27" r="2"   fill="#1E9E87"/></g>

      <!-- right legs (opposite phase) -->
      <g class="lk2" style="transform-origin:20px -6px;"> <line x1="20" y1="-6"  x2="36" y2="2"  stroke="#2EC4A9" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="3"  r="2.5" fill="#1E9E87"/></g>
      <g class="lk"  style="transform-origin:20px 4px;">  <line x1="20" y1="4"   x2="36" y2="14" stroke="#2EC4A9" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="15" r="2.5" fill="#1E9E87"/></g>
      <g class="lk3" style="transform-origin:20px 14px;"> <line x1="20" y1="14"  x2="36" y2="26" stroke="#2EC4A9" stroke-width="2.5" stroke-linecap="round"/><circle cx="37" cy="27" r="2"   fill="#1E9E87"/></g>

      <!-- tail spine -->
      <path d="M12,26 Q30,32 32,22 Q34,12 24,8" fill="none" stroke="#1E9E87" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="32" cy="22" r="3" fill="#1E9E87"/>

      <!-- EYE -->
      <circle cx="-7" cy="-8" r="13" fill="white"/>
      <circle cx="-8" cy="-9" r="9"  fill="#1A1A2E"/>
      <circle cx="-5" cy="-12" r="3.5" fill="white"/>
      <circle cx="-11" cy="-4" r="2"  fill="rgba(255,255,255,0.4)"/>

      <!-- cheek -->
      <ellipse cx="-16" cy="4" rx="6" ry="3.5" fill="rgba(255,255,255,0.22)"/>

      <!-- bubble trail -->
      <circle class="tb1" cx="24" cy="-6"  r="3.5" fill="rgba(255,255,255,0.45)"/>
      <circle class="tb2" cx="28" cy="4"   r="2.5" fill="rgba(255,255,255,0.35)"/>
      <circle class="tb3" cx="22" cy="14"  r="2"   fill="rgba(255,255,255,0.3)"/>
    </svg>
  </div>

</div>

<div class="meta">
  <span class="token">elumiMint #2EC4A9</span>
  <span class="token">elumiMintDark #1E9E87</span>
  <span class="token">elumiNavy #1A1A2E</span>
  <br><br>
  Elumi Wasserfloh · Seltene Beute · CSS SVG Animation · Für Lottie-Übergabe
</div>

</body>
</html>
